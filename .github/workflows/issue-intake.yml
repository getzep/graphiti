name: Issue intake

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name != 'issue_comment' ||
       (contains(github.event.issue.labels.*.name, 'needs-info') &&
        github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out trusted intake code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Classify issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.INTAKE_MODEL || 'claude-sonnet-4-6' }}
        run: >-
          python .github/intake/classify.py
          --repo "${{ github.repository }}"
          --number "${{ github.event.issue.number }}"
          --kind issue
          --prompt .github/prompts/issue-intake.md
          --output intake-decision.json

      - name: Validate decision through the deterministic apply layer
        run: python .github/intake/apply.py intake-decision.json --output intake-preview.json

      - name: Upload decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-intake-decision
          path: intake-decision.json
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted apply code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-intake-decision

      - name: Apply allowlisted labels and sticky comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/intake/apply.py intake-decision.json
          --repo "${{ github.repository }}"
          --number "${{ github.event.issue.number }}"
          --write
