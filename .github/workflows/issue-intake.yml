name: Issue intake

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: vars.INTAKE_ENABLED != 'false' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out intake code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Decide issue triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/intake/decide.py
          --repo "${{ github.repository }}"
          --number "${{ github.event.issue.number }}"
          --kind issue
          --output intake-decision.json

      - name: Apply allowlisted labels and sticky comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/intake/apply.py intake-decision.json
          --repo "${{ github.repository }}"
          --number "${{ github.event.issue.number }}"
          --write
