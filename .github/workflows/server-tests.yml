name: Server Tests

# Live end-to-end regression tests for the Graphiti graph_service (REST API)
# against FalkorDB and a real OpenAI model. Spawns the FastAPI server as a
# subprocess and exercises the public API end to end (ingest -> async process ->
# search -> delete). Runs on PRs and pushes to main that touch the server. OpenAI
# access uses workload identity federation: the job exchanges its GitHub OIDC
# token for a short-lived OpenAI token (IDs in the `development` environment
# variables). Fork PRs get no OIDC token, so the suite skips itself there (the
# test module skips when OPENAI_API_KEY is unset).
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
      - ".github/actions/openai-workload-identity/**"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
      - ".github/actions/openai-workload-identity/**"

permissions:
  contents: read
  id-token: write # OpenAI workload identity federation

# Cancel superseded runs on the same ref so repeated pushes don't keep paying for
# real OpenAI calls.
concurrency:
  group: server-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-server-tests:
    runs-on: depot-ubuntu-22.04
    environment: development
    # Insurance against a hung server subprocess / uv sync.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Socket Firewall wrapper
        uses: ./.github/actions/setup-socket-firewall
        with:
          socket-api-key: ${{ secrets.SOCKET_API_KEY }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"
      - name: Start FalkorDB
        # Run the database on the host network rather than a `services:` block: on
        # the depot-ubuntu runner pool bridge-network NAT silently drops packets to
        # published service-container ports. Readiness is checked via `docker exec`.
        run: docker run -d --name falkordb --network host falkordb/falkordb:latest
      - name: Install dependencies
        working-directory: server
        run: uv sync --extra dev
      # Test this checkout, not PyPI graphiti-core from uv.lock; UV_NO_SYNC keeps uv run from reverting it.
      - name: Install checkout graphiti-core
        working-directory: server
        run: uv pip install -e "..[falkordb]"
      - name: Verify checkout graphiti-core
        working-directory: server
        env:
          UV_NO_SYNC: "1"
        run: >-
          uv run --no-sync python -c "import graphiti_core, importlib.metadata, pathlib, sys;
          path = pathlib.Path(graphiti_core.__file__).resolve();
          root = pathlib.Path('$GITHUB_WORKSPACE/graphiti_core').resolve();
          print('graphiti_core.__file__=' + str(path));
          print('graphiti-core version=' + importlib.metadata.version('graphiti-core'));
          sys.exit(0 if path.is_relative_to(root) else 1)"
      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do
            if docker exec falkordb redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "falkordb ready after ${i}s"; break
            fi
            if [ "$i" -eq 30 ]; then echo "falkordb did not become ready in 30s" >&2; docker logs falkordb; exit 1; fi
            sleep 1
          done
      - name: Get OpenAI access token (workload identity)
        id: openai
        # Short-lived token for the OpenAI service account mapped to this repo's
        # `development` environment. Runs right before the tests so the token is fresh.
        # GitHub already gives fork PRs a read-only id-token; this check also stops a
        # fork PR when the repo sends write tokens to fork workflows.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/openai-workload-identity
        with:
          identity-provider-id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          service-account-id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      - name: Run live server integration tests
        working-directory: server
        env:
          OPENAI_API_KEY: ${{ steps.openai.outputs.access-token }}
          DB_BACKEND: falkordb
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
          UV_NO_SYNC: "1"
          # Use the gpt-6-luna model for the live pipeline.
          MODEL_NAME: gpt-6-luna
          # Raise episode/LLM-call concurrency so the live episode processes quickly.
          SEMAPHORE_LIMIT: "20"
        # pytest exits 5 when no tests are collected. The legitimate case is a fork
        # PR with no OPENAI_API_KEY: the suite self-skips at module level. When the
        # key IS present (same-repo run) exit 5 is unexpected — the live suite should
        # have run — so fail loudly rather than report a green build that tested
        # nothing. Likely causes: FalkorDB became unreachable (the suite also skips at
        # module level when it can't connect, even though the prior step gated it), or
        # the `integration` marker was renamed/removed so the selection matches
        # nothing. Real failures (exit 1), import errors (exit 2), and usage errors
        # such as a renamed test-file path (exit 4) always fail the job too.
        run: |
          set +e
          uv run pytest tests/test_live_falkordb_int.py -m integration -p no:cacheprovider
          code=$?
          if [ "$code" -eq 5 ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo 'No live tests ran (no OPENAI_API_KEY — fork PR self-skip); treating as success.'
              exit 0
            fi
            echo 'pytest collected no tests but OPENAI_API_KEY is set — the live suite should have run. FalkorDB likely became unreachable, or the integration test selection broke (renamed marker). Failing.' >&2
            exit 1
          fi
          exit "$code"
