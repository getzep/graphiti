name: Pull request intake

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

concurrency:
  group: pr-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    # pull_request deliberately does not expose secrets to fork PRs. Do not
    # switch this to pull_request_target or check out untrusted PR code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted intake code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Classify pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.INTAKE_MODEL || 'claude-sonnet-4-6' }}
        run: >-
          python .github/intake/classify.py
          --repo "${{ github.repository }}"
          --number "${{ github.event.pull_request.number }}"
          --kind pull_request
          --prompt .github/prompts/pr-intake.md
          --output intake-decision.json

      - name: Validate decision through the deterministic apply layer
        run: python .github/intake/apply.py intake-decision.json --output intake-preview.json

      - name: Upload decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-intake-decision
          path: intake-decision.json
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted apply code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-intake-decision

      - name: Apply allowlisted labels and sticky comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/intake/apply.py intake-decision.json
          --repo "${{ github.repository }}"
          --number "${{ github.event.pull_request.number }}"
          --write
