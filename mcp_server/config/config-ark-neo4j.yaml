# Graphiti MCP: Volcengine Ark chat + local embeddings + Neo4j
# Secrets are read only from environment variables. Never put a real key here.
server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: ${ARK_CHAT_MODEL}
  temperature: 0
  max_tokens: 8192
  # Ark's Chat Completions compatibility does not guarantee response_format.
  # Graphiti injects the JSON schema into the prompt and omits that parameter.
  structured_output_mode: "prompt_only"
  providers:
    openai:
      api_key: ${ARK_API_KEY}
      api_url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}

embedder:
  # The supplied Doubao Seed endpoint is a chat model, not an embedding model.
  # This dependency-free fallback makes the stack runnable immediately. For
  # production, switch to openai and provision a separate Ark text-embedding endpoint.
  provider: "local_hash"
  model: "local-feature-hash"
  # Must match graphiti-core's process-wide vector width.
  dimensions: ${EMBEDDING_DIM:1024}

database:
  provider: "neo4j"
  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}

graphiti:
  # graphiti-core routes an explicit group_id to a same-named database. Keep the
  # default aligned with the configured Neo4j database unless the deployment has
  # provisioned additional databases intentionally.
  group_id: ${NEO4J_DATABASE:neo4j}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    - name: "Person"
      description: "A human referenced by the source content"
    - name: "Organization"
      description: "A company, team, institution, or formal group"
    - name: "Document"
      description: "A source document, specification, record, or report"
    - name: "Requirement"
      description: "A product or project requirement"
    - name: "Event"
      description: "A time-bound activity or occurrence"
    - name: "Topic"
      description: "A subject or knowledge domain"
