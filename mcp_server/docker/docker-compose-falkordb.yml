services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6379:6379" # Redis/FalkorDB port
      - "127.0.0.1:3000:3000" # FalkorDB web UI
    environment:
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - BROWSER=${BROWSER:-1}  # Enable FalkorDB Browser UI (set to 0 to disable)
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  graphiti-mcp:
    # To use the latest graphiti-core, build locally with:
    #   docker compose -f docker-compose-falkordb.yml build
    # The Docker Hub image may lag behind the latest release.
    image: zepai/knowledge-graph-mcp:standalone
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone
    env_file:
      - path: ../.env
        required: false
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      # Database configuration
      - FALKORDB_URI=${FALKORDB_URI:-redis://falkordb:6379}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-default_db}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      # Provider credentials and model settings. Bare names pass the value through
      # only when it is set (shell, .env, or the Portainer/Coolify stack env), so an
      # unset variable keeps the default from the config file.
      - OPENAI_API_KEY
      - OPENAI_API_URL
      - OPENAI_ORGANIZATION_ID
      - ANTHROPIC_API_KEY
      - GOOGLE_API_KEY
      - GROQ_API_KEY
      - VOYAGE_API_KEY
      - AZURE_OPENAI_API_KEY
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_DEPLOYMENT
      - AZURE_OPENAI_EMBEDDINGS_ENDPOINT
      - AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT
      - MODEL_NAME
      - EMBEDDER_MODEL
      - LLM__PROVIDER
      - EMBEDDER__PROVIDER
      - GRAPHITI_TELEMETRY_ENABLED
    volumes:
      - ../config/config-docker-falkordb.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000" # Expose the MCP server via HTTP transport
    command: ["uv", "run", "main.py"]

volumes:
  falkordb_data:
    driver: local
