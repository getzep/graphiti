# Runs the published images. The config file is the one inside the image
# (CONFIG_PATH). To build locally and mount ../config/config-docker-falkordb.yaml:
#   docker compose -f docker-compose-falkordb.yml -f docker-compose-falkordb.build.yml up --build
services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Redis/FalkorDB port
      - "127.0.0.1:3000:3000" # FalkorDB web UI
    environment:
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - BROWSER=${BROWSER:-1}  # Enable FalkorDB Browser UI (set to 0 to disable)
      # Append-only file: every write is logged, so a hard stop loses at most ~1s.
      - REDIS_ARGS=${REDIS_ARGS:---appendonly yes}
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  graphiti-mcp:
    # To use the latest graphiti-core, build locally with:
    #   docker compose -f docker-compose-falkordb.yml -f docker-compose-falkordb.build.yml build
    # The Docker Hub image may lag behind the latest release.
    image: zepai/knowledge-graph-mcp:standalone
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      # Database configuration
      - FALKORDB_URI=${FALKORDB_URI:-redis://falkordb:6379}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-default_db}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=${CONFIG_PATH:-/app/mcp/config/config-docker-falkordb.yaml}
    ports:
      - "127.0.0.1:8000:8000" # Expose the MCP server via HTTP transport
    command: ["uv", "run", "main.py"]

volumes:
  falkordb_data:
    driver: local
