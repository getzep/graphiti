# Runs the published image. To build it locally instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
# (Kept out of this file so Git-based deploys such as Portainer stacks, which
# run a build step whenever a service has build:, only pull the image.)
services:
  graphiti-falkordb:
    image: zepai/knowledge-graph-mcp:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      # FalkorDB configuration
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - BROWSER=${BROWSER:-1}  # Enable FalkorDB Browser UI (set to 0 to disable)
      # MCP Server configuration
      - FALKORDB_URI=redis://localhost:6379
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-default_db}
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
    volumes:
      - falkordb_data:/var/lib/falkordb/data
      - mcp_logs:/var/log/graphiti
    ports:
      - "127.0.0.1:6379:6379"  # FalkorDB/Redis
      - "127.0.0.1:3000:3000"  # FalkorDB web UI
      - "127.0.0.1:8000:8000"  # MCP server HTTP
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  falkordb_data:
    driver: local
  mcp_logs:
    driver: local
