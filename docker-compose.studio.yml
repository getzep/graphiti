name: graphiti-studio

services:
  neo4j:
    image: neo4j:5.26.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-replace-with-a-strong-local-password}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  graph:
    build:
      context: .
      dockerfile: server/Dockerfile.local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAPHITI_SERVER_PORT:-8000}:8000"
    volumes:
      - graphiti_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      ARK_API_KEY: "${ARK_API_KEY:-}"
      ARK_BASE_URL: "${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      ARK_CHAT_MODEL: "${ARK_CHAT_MODEL:-}"
      ARK_STRUCTURED_OUTPUT_MODE: "${STRUCTURED_OUTPUT_MODE:-prompt_only}"
      ARK_TEMPERATURE: "${LLM_TEMPERATURE:-0}"
      ARK_MAX_TOKENS: "${LLM_MAX_TOKENS:-8192}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-local_hash}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-local-feature-hash}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-1024}"
      DB_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-replace-with-a-strong-local-password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      SOURCE_STATE_PATH: /app/data/source_state.db
      UPLOAD_ROOT: /app/data/uploads
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-26214400}"
      SYNC_CONCURRENCY: "${SYNC_CONCURRENCY:-1}"
      OAUTH_PUBLIC_BASE_URL: "${OAUTH_PUBLIC_BASE_URL:-http://localhost:8000}"
      OAUTH_TOKEN_ENCRYPTION_KEY: "${OAUTH_TOKEN_ENCRYPTION_KEY:-}"
      OAUTH_COOKIE_SECURE: "${OAUTH_COOKIE_SECURE:-false}"
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_BASE_URL: "${FEISHU_BASE_URL:-https://open.feishu.cn/open-apis}"
      FEISHU_OAUTH_SCOPES: "${FEISHU_OAUTH_SCOPES:-offline_access space:document:retrieve docx:document:readonly drive:file:readonly}"
      MEEGO_HOST: "${MEEGO_HOST:-project.feishu.cn}"
      MEEGO_PLUGIN_ID: "${MEEGO_PLUGIN_ID:-}"
      MEEGO_PLUGIN_SECRET: "${MEEGO_PLUGIN_SECRET:-}"
      MEEGO_USER_KEY: "${MEEGO_USER_KEY:-}"
      MEEGO_BASE_URL: "${MEEGO_BASE_URL:-https://project.feishu.cn/open_api}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-http://localhost:8001/mcp/}"
      GRAPHITI_TELEMETRY_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile.local
    restart: unless-stopped
    command: ["python", "main.py", "--config", "config/config-ark-neo4j.yaml"]
    ports:
      - "127.0.0.1:${GRAPHITI_MCP_PORT:-8001}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      ARK_API_KEY: "${ARK_API_KEY:-}"
      ARK_BASE_URL: "${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      ARK_CHAT_MODEL: "${ARK_CHAT_MODEL:-}"
      LLM__STRUCTURED_OUTPUT_MODE: "${STRUCTURED_OUTPUT_MODE:-prompt_only}"
      LLM__TEMPERATURE: "${LLM_TEMPERATURE:-0}"
      LLM__MAX_TOKENS: "${LLM_MAX_TOKENS:-8192}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-replace-with-a-strong-local-password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      USER_ID: "${USER_ID:-mcp_user}"
      SEMAPHORE_LIMIT: "${SEMAPHORE_LIMIT:-2}"
      EMBEDDER__PROVIDER: "${EMBEDDING_PROVIDER:-local_hash}"
      EMBEDDER__MODEL: "${EMBEDDING_MODEL_NAME:-local-feature-hash}"
      EMBEDDER__DIMENSIONS: "${EMBEDDING_DIM:-1024}"
      EMBEDDER__PROVIDERS__OPENAI__API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDER__PROVIDERS__OPENAI__API_URL: "${EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      GRAPHITI_TELEMETRY_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  neo4j_data:
  graphiti_data:
